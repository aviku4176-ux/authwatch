; AuthWatch example configuration (v2).
; Usage: python authwatch.py --config authwatch.ini --logfile /var/log/auth.log

[detect]
window = 300
fail_threshold = 5
stuff_threshold = 10
spray_users = 5
spray_ips = 5
success_after = 3
recon_threshold = 30
user_threshold = 3
persist_buckets = 6
allowlist = 10.0.0.0/8,192.168.0.0/16,127.0.0.1
; denylist = 203.0.113.0/24
; focus_users = admin,root

[output]
; ban_cmd = iptables -A INPUT -s {ip} -j DROP
; cef = true
; alert_file = /var/log/authwatch-alerts.jsonl
; syslog_host = 10.0.0.5
; syslog_port = 514
; webhook_url = https://hooks.example.com/alerts
; state_file = /var/lib/authwatch/state.json